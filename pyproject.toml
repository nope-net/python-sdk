[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nope-net"
dynamic = ["version"]
description = "Python SDK for the NOPE safety API: risk classification for conversations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "NopeNet, LLC", email = "support@nope.net" }
]
keywords = ["safety", "ai", "risk", "classification", "mental-health", "crisis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    # mypy 2.x dropped `python_version = "3.9"`; 1.x still type-checks against the 3.9 floor.
    "mypy>=1.8,<2",
    "build>=1.0",
]

[project.urls]
Homepage = "https://nope.net"
Documentation = "https://docs.nope.net"
Repository = "https://github.com/nope-net/python-sdk"
Issues = "https://github.com/nope-net/python-sdk/issues"
Changelog = "https://github.com/nope-net/python-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/nope_net/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nope_net"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/dist", "/___*"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
strict = true

# anyio (pulled in by httpx) ships py3.10+ syntax; checking it under the 3.9 floor
# fails to parse. Our own code is what the floor guards, so skip following into it.
[[tool.mypy.overrides]]
module = ["anyio", "anyio.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls api.nope.net with a real key; opt in with NOPE_LIVE=1 and `pytest -m live`",
]
addopts = "-m \"not live\""
